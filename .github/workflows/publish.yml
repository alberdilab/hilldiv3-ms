# Renders the bookdown publication and deploys it to GitHub Pages.
# Based on the alberdilabr publication workflow.
# Before the first run, set Settings -> Pages -> Source to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

name: publish

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv

      - uses: r-lib/actions/setup-renv@v2

      - name: Cache bookdown intermediates
        uses: actions/cache@v5
        with:
          path: _bookdown_files
          key: bookdown-${{ hashFiles('**/*.Rmd') }}
          restore-keys: bookdown-

      - name: Render book
        run: bookdown::render_book("index.Rmd")
        shell: Rscript {0}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
